<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A Z Hotel | Guest Safety Companion</title><style>body{margin:0;background:#eef2f6;font:16px system-ui;color:#102a43}.phone{max-width:430px;margin:24px auto;background:white;min-height:760px;border-radius:26px;box-shadow:0 14px 35px #0003;overflow:hidden}.head{background:#123a5a;color:#fff;padding:25px}.tag{font-size:12px;opacity:.8;letter-spacing:.08em}.content{padding:18px}.notice{background:#fff6dc;border-left:4px solid #c28b00;padding:12px;font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}button{padding:18px 12px;border:0;border-radius:13px;background:#e8f0f6;color:#123a5a;text-align:left;font-weight:700;font-size:14px;cursor:pointer}button.urgent{background:#a52a2a;color:white}.panel{margin-top:16px;padding:16px;background:#f3f6f8;border-radius:12px;display:none}.small{font-size:13px;color:#486581}input,textarea{width:100%;box-sizing:border-box;margin:5px 0 10px;padding:10px;border:1px solid #b8c4cf;border-radius:7px}</style></head><body><main class="phone"><header class="head"><div class="tag">AGENTICANGELS.COM × A Z HOTEL</div><h1>Guest Safety Companion</h1><div>Private concept • fictional demonstration data</div></header><section class="content"><div class="notice">This is a concept screen. No hotel system, guest data, room card, CCTV or emergency service is connected.</div><div class="grid"><button class="urgent" onclick="show('urgent')">Urgent help</button><button onclick="show('overnight')">Overnight contact</button><button onclick="show('visitor')">Visitor approval</button><button onclick="show('card')">Lost / compromised card</button><button onclick="show('concern')">Report a concern</button><button onclick="show('maintenance')">Maintenance request</button></div><div id="panel" class="panel"></div></section></main><script>const p=document.getElementById('panel');function show(x){let h={urgent:'<b>Urgent help</b><p>Use the hotel-approved emergency route. Contact details and escalation rules must be confirmed by management before use.</p>',overnight:'<b>Overnight contact</b><p>Display the management-approved on-call contact here. This demo intentionally uses no real number.</p>',visitor:'<b>Request a trusted visitor</b><input placeholder="Visitor name"><input placeholder="Requested time window"><button onclick="done(\'Visitor request\')">Submit for staff approval</button>',card:'<b>Lost or compromised card</b><p>Staff can record the report, revoke the old card where the existing system supports it, and issue a replacement.</p><button onclick="done(\'Card concern\')">Create report</button>',concern:'<b>Report a concern</b><textarea placeholder="Brief description"></textarea><button onclick="done(\'Concern\')">Submit report</button>',maintenance:'<b>Maintenance request</b><textarea placeholder="What needs attention?"></textarea><button onclick="done(\'Maintenance request\')">Submit request</button>'}[x];p.innerHTML=h;p.style.display='block'}function done(t){p.innerHTML='<b>Request recorded</b><p>'+t+' reference: DEMO-'+Math.floor(1000+Math.random()*8999)+'</p><p class="small">Fictional demonstration only. Staff workflow and contacts require management confirmation.</p>'}</script></body></html>
